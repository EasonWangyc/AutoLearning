<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="AutoLearning — 把任意 URL 变成结构化学习笔记">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1020"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B1020"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="45%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="stroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.5"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="340" fill="url(#bg)"/>
  <ellipse cx="960" cy="60" rx="420" ry="240" fill="url(#glow)"/>
  <ellipse cx="120" cy="320" rx="360" ry="200" fill="url(#glow)" opacity="0.5"/>

  <!-- Wordmark -->
  <g transform="translate(80, 96)">
    <text x="0" y="0" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="76" font-weight="700" fill="url(#word)" letter-spacing="-1.5">AutoLearning</text>
    <text x="2" y="58" font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="24" fill="#CBD5E1">把任意 URL 变成结构化 Markdown 学习笔记</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16">
      <rect x="0" y="92" rx="15" ry="15" width="176" height="30" fill="#0EA5E9" fill-opacity="0.12" stroke="#38BDF8" stroke-opacity="0.45"/>
      <text x="18" y="112" fill="#7DD3FC">网页 · 视频 · 文件</text>
      <rect x="190" y="92" rx="15" ry="15" width="152" height="30" fill="#A78BFA" fill-opacity="0.12" stroke="#A78BFA" stroke-opacity="0.45"/>
      <text x="208" y="112" fill="#C4B5FD">多 LLM 后端</text>
      <rect x="356" y="92" rx="15" ry="15" width="136" height="30" fill="#F472B6" fill-opacity="0.12" stroke="#F472B6" stroke-opacity="0.45"/>
      <text x="374" y="112" fill="#F9A8D4">本地转录</text>
    </g>
  </g>

  <!-- URL → note motif -->
  <g transform="translate(820, 78)">
    <rect x="0" y="0" width="300" height="184" rx="16" fill="url(#card)" stroke="url(#stroke)" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="#F87171"/>
    <circle cx="42" cy="24" r="5" fill="#FBBF24"/>
    <circle cx="60" cy="24" r="5" fill="#34D399"/>
    <line x1="0" y1="42" x2="300" y2="42" stroke="#334155" stroke-width="1"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13">
      <text x="22" y="70" fill="#64748B">$</text>
      <text x="40" y="70" fill="#E2E8F0">autolearn</text>
      <text x="40" y="92" fill="#38BDF8">https://example.com/post</text>

      <rect x="22" y="108" width="256" height="6" rx="3" fill="#334155"/>
      <rect x="22" y="108" width="180" height="6" rx="3" fill="url(#word)"/>
      <text x="22" y="138" fill="#94A3B8">✓ 抓取</text>
      <text x="98" y="138" fill="#94A3B8">✓ 清洗</text>
      <text x="174" y="138" fill="#94A3B8">✓ 生成</text>
      <text x="22" y="164" fill="#34D399">→ notes/example-post.md</text>
    </g>
  </g>
</svg>
